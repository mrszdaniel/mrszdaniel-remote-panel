<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ticket hunter">
<meta name="theme-color" content="#dc052d">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Ticket hunter</title>
<script>try { var th = localStorage.getItem('rp_theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}</script>
<style>
:root {
  --red: #dc052d; --red-dark: #b80426;
  --bg: #f4f4f6; --card: #ffffff; --soft: #f6f6f8; --line: #e6e6ea;
  --ink: #1d1d1f; --muted: #6b6b72; --faint: #8a8a90;
  --ok: #137333; --warn: #9a5b00; --bad: #c5221f; --link: #0066b2;
  --warn-bg: #fff4e5; --bad-bg: #fdecea; --ok-bg: #e7f4ea;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
.head { flex: none; z-index: 5; background: var(--red); color: #fff;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; display: flex; align-items: center; gap: 10px; }
.head .name { flex: 1; font-weight: 600; font-size: 18px; }
.pill { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #fff; color: #555; white-space: nowrap; }
.pill .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
.pill.on { color: #137333; } .pill.on .dot { animation: beat 1.6s ease-in-out infinite; }
.pill.off { color: #c5221f; } .pill.wait { color: #9a5b00; }
@keyframes beat { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill.on .dot { animation: none; } }
.lang { all: unset; cursor: pointer; font-size: 13px; font-weight: 600; border: 1px solid rgba(255,255,255,.6); border-radius: 7px; padding: 3px 8px; }
.ctx { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 14px; display: grid;
  grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; align-items: center; }
.ctx .lbl { color: var(--muted); font-size: 14px; }
select, input[type=text], input[type=number] { width: 100%; font: inherit; font-size: 16px; padding: 9px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.note { grid-column: 1 / -1; font-size: 13px; color: var(--warn); }
main { padding: 12px 12px 0; display: grid; gap: 12px; max-width: 560px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.card h2 { font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--muted); margin: 0 0 8px; text-transform: none; }
.big { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.big .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); flex: none; }
.big.hunting .dot { background: var(--ok); } .big.paused .dot { background: var(--warn); }
.big.clicking .dot { background: var(--red); } .big.hold .dot { background: var(--warn); } .big.away .dot { background: var(--link); }
.sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.rows { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 6px; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 15px; }
.row .k { color: var(--muted); } .row .v { text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.banner { border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }
.banner.bad { background: var(--bad-bg); color: var(--bad); font-weight: 600; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.item { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--soft);
  border-radius: 10px; padding: 9px 10px; margin-top: 6px; font-size: 15px; }
.item .p { color: var(--muted); }
.btns { display: flex; gap: 10px; margin-top: 12px; }
button { font: inherit; font-size: 16px; cursor: pointer; flex: 1; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); -webkit-tap-highlight-color: transparent; }
button:active { transform: scale(.98); }
button.primary { background: var(--red); border-color: var(--red); color: #fff; }
button.danger { color: var(--bad); }
button.sure { background: var(--bad); border-color: var(--bad); color: #fff; }
button.small { flex: none; padding: 6px 12px; font-size: 14px; border-radius: 9px; }
button:disabled { opacity: .5; }
.ev { font-size: 14px; color: var(--muted); padding: 3px 0; display: flex; gap: 8px; }
.ev time { color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
label { display: block; margin-top: 12px; color: var(--muted); font-size: 14px; }
label > input, label > select { margin-top: 5px; }
.check { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 16px; }
.check input { width: 22px; height: 22px; accent-color: var(--red); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-size: 13px; color: var(--faint); margin-top: 4px; }
.err { font-size: 13px; color: var(--bad); margin-top: 4px; }
.confirm { background: var(--warn-bg); color: var(--warn); padding: 12px 14px; font-size: 15px; border-bottom: 1px solid var(--line); }
.toast { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  background: #1d1d1f; color: #fff; border-radius: 12px; padding: 12px 14px; font-size: 15px; text-align: center;
  box-shadow: 0 6px 24px rgba(0,0,0,.25); max-width: 536px; margin: 0 auto; }
.toast.bad { background: var(--bad); }
.foot { text-align: center; font-size: 13px; color: var(--faint); padding: 4px 0 8px; }
.foot button { all: unset; color: var(--link); cursor: pointer; margin-left: 6px; }
.intro { text-align: center; padding: 40px 18px; color: var(--muted); }
.intro b { color: var(--ink); display: block; font-size: 20px; margin-bottom: 8px; }
/* seat map */
.seatmap { margin: 10px -4px 4px; }
.seatmap svg { display: block; width: 100%; height: auto; }
.seatmap .blk { stroke: var(--card); stroke-width: 1.5; }
.seatmap .num { fill: var(--muted); }
.seatmap .num.on { fill: #fff; }
.seatmap .pitchbg { fill: var(--card); }
.seatmap .lines { fill: none; stroke: var(--line); stroke-width: 1.5; }
.mapinfo { background: var(--soft); border-radius: 10px; padding: 8px 10px; font-size: 14px; margin-bottom: 4px; }
#skipList .item { font-size: 14px; }
#skipList .why { color: var(--muted); }
.hidden { display: none !important; }
/* ---- 2.2.0: one structure with the panel: bar, cart strip, tabs at the bottom ---- */
.bar { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.bar select { flex: 1; min-width: 0; margin: 0; }
.acc { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); white-space: nowrap; max-width: 46%; font-size: 15px; -webkit-tap-highlight-color: transparent; }
.acc .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.acc .st { font-size: 13px; color: var(--muted); }
.acc.ok .ck { color: var(--ok); font-weight: 700; }
.acc.wrong { background: var(--bad-bg); border-color: var(--bad); } .acc.wrong .st { color: var(--bad); }
.acc.out { background: var(--warn-bg); } .acc.out .st { color: var(--warn); }
.acc.none { border-style: dashed; color: var(--muted); }
.notebar { background: var(--warn-bg); color: var(--warn); font-size: 14px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.strip { display: block; width: auto; margin: 12px 12px 0; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 15px; }
.strip.empty { color: var(--muted); }
.strip.full { background: #fde8ec; border-color: #f3b5c1; color: #9a0420; }
.strip .top { display: flex; justify-content: space-between; font-weight: 600; } .strip .top span:last-child { font-weight: 400; color: var(--link); }
.strip .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.strip .tag { background: var(--card); color: var(--ink); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { all: unset; cursor: pointer; font-size: 15px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); display: inline-flex; align-items: center; gap: 6px; -webkit-tap-highlight-color: transparent; }
.chip[aria-pressed="true"] { border-color: var(--red); background: #fde8ec; color: #9a0420; font-weight: 600; }
.chip.changed { border-color: #e3a33b; background: var(--warn-bg); color: var(--warn); }
.chip.dashed { border-style: dashed; color: var(--muted); }
.chip svg { flex: none; }
.tabbar { flex: none; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tabbar button { all: unset; cursor: pointer; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; color: var(--muted); position: relative; -webkit-tap-highlight-color: transparent; }
.tabbar button[aria-selected="true"] { color: var(--red); font-weight: 600; }
.tabbar .n { position: absolute; top: 2px; left: 54%; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 0 6px; }
.tabbar .dotr { position: absolute; top: 6px; left: 58%; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.sec { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
.inline { margin: 6px 0 0 32px; color: var(--muted); font-size: 15px; line-height: 2.6; }
.inline input { display: inline-block; width: 74px; margin: 0 4px; vertical-align: middle; line-height: normal; }
.indent { margin-left: 32px; }
.ro { font-size: 15px; } .ro b { overflow-wrap: anywhere; }
.presetbox { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 15px; }
.presetbox .btns { margin-top: 8px; } .presetnow { color: var(--muted); font-size: 15px; margin-top: 10px; }
.linkrow { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; }
.link { all: unset; cursor: pointer; color: var(--link); font-size: 16px; min-height: 32px; display: inline-flex; align-items: center; }
.link:disabled { opacity: .45; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.tile { background: var(--soft); border-radius: 12px; padding: 10px 12px; } .tile .k { font-size: 13px; color: var(--muted); } .tile .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.newrep { color: #9a0420; font-size: 14px; margin-top: 4px; }
.prow { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-top: 8px; background: var(--card); }
.prow.on { border-color: var(--red); background: #fde8ec; }
.prow .use { all: unset; cursor: pointer; display: block; width: 100%; min-height: 44px; }
.prow .nm { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.prow .ds { font-size: 14px; color: var(--muted); }
.prow .tag { font-size: 12px; font-weight: 700; color: #9a0420; background: #fff; border: 1px solid #f3b5c1; border-radius: 999px; padding: 0 8px; margin-right: 6px; }
.prow .tag.ch { color: var(--warn); border-color: #e3a33b; }
.prow .btns { margin-top: 8px; } .prow .btns button { flex: none; padding: 8px 14px; font-size: 15px; }
.pform { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 8px; background: var(--card); }
.back { all: unset; cursor: pointer; color: var(--link); font-size: 16px; min-height: 36px; display: inline-flex; align-items: center; }
.toast { bottom: calc(82px + env(safe-area-inset-bottom, 0px)); }

/* 2.3.0: appearance. System follows the iPhone; Light or Dark (More → This phone) is forced via <html data-theme> */
:root { color-scheme: light dark; } :root[data-theme="light"] { color-scheme: light; } :root[data-theme="dark"] { color-scheme: dark; }
@media (prefers-color-scheme: dark) {
:root:not([data-theme="light"]) { --bg: #111113; --card: #1c1c1f; --soft: #26262a; --line: #303035;
    --ink: #f1f1f3; --muted: #a3a3ab; --faint: #7d7d85;
    --ok: #6fcf8c; --warn: #f0b45a; --bad: #ff7b72; --link: #6cb6ff;
    --warn-bg: #3a2d16; --bad-bg: #3d1d1b; --ok-bg: #173322; }
:root:not([data-theme="light"]) .strip.full { background: #3d1d24; border-color: #6a2a37; color: #ffb3c1; }
:root:not([data-theme="light"]) .chip[aria-pressed="true"] { background: #3d1d24; color: #ffb3c1; }
:root:not([data-theme="light"]) .newrep { color: #ffb3c1; }
:root:not([data-theme="light"]) .prow.on { background: #3d1d24; }
}
:root[data-theme="dark"] { --bg: #111113; --card: #1c1c1f; --soft: #26262a; --line: #303035;
    --ink: #f1f1f3; --muted: #a3a3ab; --faint: #7d7d85;
    --ok: #6fcf8c; --warn: #f0b45a; --bad: #ff7b72; --link: #6cb6ff;
    --warn-bg: #3a2d16; --bad-bg: #3d1d1b; --ok-bg: #173322; }
:root[data-theme="dark"] .strip.full { background: #3d1d24; border-color: #6a2a37; color: #ffb3c1; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { background: #3d1d24; color: #ffb3c1; }
:root[data-theme="dark"] .newrep { color: #ffb3c1; }
:root[data-theme="dark"] .prow.on { background: #3d1d24; }
/* 2.3.0: the frame */
/* 2.3.3: the page scrolls as a whole, header fixed on top (sticky), tab bar fixed at the bottom.
   On the iPhone home-screen app, iOS drew the app down to the real bottom edge only when the page itself
   could scroll (2.2.0: right on Settings/More, wrong on the short Status/Cart). So every tab is made a bit
   taller than the screen, and the bounce at the ends is switched off (keeps the header in place). */
html, body { overscroll-behavior: none; }
html { min-height: calc(100vh + env(safe-area-inset-top, 0px) + 1px); }
body { padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
.head { position: sticky; top: 0; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; }
#scroller { display: block; }

/* 2.3.0: status card, latest event, cart cards, appearance switch, icons */
.statusline { font-size: 21px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.statusline .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); flex: none; }
.statusline.hunting .dot { background: var(--ok); } .statusline.paused .dot, .statusline.hold .dot { background: var(--warn); }
.statusline.clicking .dot, .statusline.stopped .dot { background: var(--red); }
#navMsg { font-variant-numeric: tabular-nums; } .statusline.away .dot { background: var(--link); }
.tiles3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.tilew { background: var(--soft); border-radius: 12px; padding: 10px 12px; margin-top: 12px; }
.tilew .k, .tiles3 .k { font-size: 13px; color: var(--muted); } .tilew .v { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.tiles3 .tile { padding: 9px 10px; } .tiles3 .v { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.carttitle { font-size: 18px; font-weight: 600; } .cartlimit { font-size: 14px; color: var(--muted); margin-top: 2px; }
.citem { display: flex; align-items: center; gap: 10px; background: var(--soft); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
.citem .num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--card); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.citem .txt { flex: 1; min-width: 0; font-size: 15px; } .citem .meta { font-size: 13px; color: var(--muted); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 8px; }
.seg button { border: none; border-radius: 0; padding: 9px 6px; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.ico { display: inline-flex; vertical-align: -3px; }
#toggle { display: flex; align-items: center; justify-content: center; gap: 8px; }
.strip.empty { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
<div class="head">
  <span class="name" id="title">Ticket hunter</span>
  <span class="pill wait" id="online"><span class="dot"></span><span id="onlineText">…</span></span>
</div>

<div id="scroller">
<!-- not paired -->
<div class="intro hidden" id="unpaired"><b id="upTitle"></b><span id="upText"></span>
  <label style="text-align:left;margin-top:22px"><span id="lPaste"></span><input type="text" id="paste" autocapitalize="off" autocomplete="off" autocorrect="off"></label>
  <div class="err hidden" id="ePaste" style="text-align:left"></div>
  <div class="btns"><button class="primary" id="pairBtn" type="button"></button></div>
  <div class="seg" role="group" aria-label="Language" style="max-width:240px;margin:22px auto 0"><button type="button" id="upLangEn">English</button><button type="button" id="upLangHu">Magyar</button></div>
</div>
<div class="banner warn hidden" id="installTip" style="margin:12px 12px 0;border-radius:12px"></div>

<!-- paired -->
<div id="app" class="hidden">
  <div class="bar">
    <button class="acc" id="accPill" type="button"></button>
    <select id="match" aria-label="Match"></select>
  </div>
  <div class="notebar hidden" id="matchNote"></div>
  <div class="confirm hidden" id="confirm"><div id="confirmText"></div>
    <div class="btns"><button class="primary" id="cYes" type="button"></button><button id="cNo" type="button"></button></div>
  </div>
  <button class="strip hidden" id="strip" type="button"></button>

  <!-- Status -->
  <main id="vStatus">
    <section class="card">
      <div class="statusline" id="state"><span class="dot"></span><span id="stateText"></span></div>
      <div class="sub" id="navMsg"></div>
      <div class="banner bad hidden" id="stuck"></div>
      <div class="tilew"><div class="k" id="kMode"></div><div class="v" id="vMode"></div></div>
      <div class="tiles3">
        <div class="tile"><div class="k" id="kListed"></div><div class="v" id="vListed"></div></div>
        <div class="tile"><div class="k" id="kLast"></div><div class="v" id="vLast"></div></div>
        <div class="tile"><div class="k" id="kRefresh"></div><div class="v" id="vRefresh"></div></div>
      </div>
    </section>
    <section class="card">
      <h2 id="hPreset"></h2>
      <div class="chips" id="presetChips"></div>
    </section>
    <section class="card hidden" id="latestCard">
      <h2 id="hLatest"></h2>
      <div id="latest"></div>
    </section>
    <div class="btns" style="margin-top:0"><button id="toggle" type="button"></button></div>
  </main>

  <!-- Cart -->
  <main id="vCart" class="hidden">
    <section class="card">
      <div class="carttitle" id="hCart"></div>
      <div class="cartlimit hidden" id="cartLimit"></div>
      <div class="banner warn hidden" id="cartTask"></div>
      <div class="seatmap hidden" id="seatMap"></div>
      <div class="mapinfo hidden" id="mapInfo"></div>
      <div id="items"></div>
      <div class="btns" id="cartBtns"><button class="danger" id="removeAll" type="button"></button><button class="primary" id="checkout" type="button"></button></div>
      <div class="btns"><button id="hunt" type="button"></button></div>
      <div class="row hidden" id="skipRow" style="align-items:center;margin-top:8px"><span class="k" id="skipText"></span><button class="small" id="skipToggle" type="button"></button></div>
      <div class="hidden" id="skipList"></div>
    </section>
  </main>

  <!-- Settings -->
  <main id="vSettings" class="hidden">
    <section class="card">
      <h2 id="hAccount"></h2>
      <div class="chips" id="accChips"></div>
      <div class="hint" id="hAccounts"></div>
      <label class="check" style="margin-top:12px"><input type="checkbox" id="fRelogin"><span id="lfRelogin"></span></label>
      <div class="inline" id="wRelogin"><span id="lReEvery"></span><input type="number" inputmode="numeric" min="15" max="600" step="1" id="fReloginMin">±<input type="number" inputmode="numeric" min="0" max="300" step="1" id="fReloginJit"><span id="lReMin"></span></div>
      <div class="err hidden" id="eReloginMin"></div><div class="err hidden" id="eReloginJit"></div>
    </section>
    <section class="card">
      <h2 id="hHunt"></h2>
      <label style="margin-top:0"><span id="lfMode"></span><select id="fMode"></select></label>

// Save (optionally with "update the active preset" or "save as a new preset"): one command, checked again by the computer
function saveSettings(preset) {
  const mode = $('fMode').value, refresh = parseNum($('fRefresh').value), jitter = parseNum($('fJitter').value);
  const seats = parseInt($('fSeats').value, 10), stuckMin = parseNum($('fStuckMin').value);
  const failLimit = parseInt($('fFail').value, 10), failMinutes = parseInt($('fFailMin').value, 10);
  const reOn = $('fRelogin').checked, reMin = parseInt($('fReloginMin').value, 10), reJit = parseInt($('fReloginJit').value, 10);
  const errors = {
    ReloginMin: reOn && !(reMin >= 15 && reMin <= 600),
    ReloginJit: reOn && !(reJit >= 0 && reJit < reMin),
    Price: mode === 'price' && parseNum(String($('fPrice').value).replace(/[^\d,.]/g, '')) === null,
    Blocks: mode === 'blocks' && !$('fBlocks').value.trim(),
    Seats: mode === 'adjacent' && !(seats >= 2),
    Refresh: refresh === null || refresh < 1,
    Jitter: jitter === null || jitter < 0 || (refresh !== null && jitter >= refresh),
    Fail: !(failLimit >= 0 && failLimit <= 20),
    FailMin: !(failMinutes >= 1 && failMinutes <= 1440),
    StuckMin: $('fStuck').checked && !(stuckMin >= 1),
  };
  let first = null;
  for (const [k, bad] of Object.entries(errors)) { $('e' + k).classList.toggle('hidden', !bad); if (bad && !first) first = $('f' + k); }
  if (first) { first.focus(); return; }
  const p = { mode, refresh, jitter, sound: $('fSound').checked, ntfy: $('fNtfy').checked, desktop: $('fDesktop').checked, stuck: $('fStuck').checked, reloginOn: reOn };
  if (mode === 'price') p.price = $('fPrice').value.trim();
  if (mode === 'blocks') p.blocks = $('fBlocks').value.trim();
  if (mode === 'adjacent') p.seats = seats;
  if (stuckMin >= 1) p.stuckMin = stuckMin;
  if (reOn) { p.reloginMin = reMin; p.reloginJitter = reJit; }
  p.failLimit = failLimit; p.failMinutes = failMinutes;
  p.bgCheck = $('fBg').checked;
  if (preset) p.preset = preset;
  send('set', p);
  showView('status');
}

function savePreset() {
  const mode = $('pfMode').value, name = $('pfName').value.trim();
  const value = mode === 'price' ? $('pfPrice').value.trim() : mode === 'blocks' ? $('pfBlocks').value.trim() : mode === 'adjacent' ? $('pfSeats').value : '';
  const prob = nameProblem(name, presetEdit.id)
    || (mode === 'price' && priceNum(value) === null ? T.errPrice : mode === 'blocks' && !value ? T.errBlocks : mode === 'adjacent' && !(parseInt(value, 10) >= 2) ? T.errSeats : '');
  if (prob) { $('pfErr').textContent = prob; $('pfErr').classList.remove('hidden'); return; }
  if (!dupCheck($('pfErr'), $('pfSave'), mode, value, presetEdit.id)) return;

}

// ================= seat map (cart section) =================
const CAT = { 1: '#d6013b', 2: '#eb6609', 3: '#a0c408', 4: '#00529e', 5: '#f5ba04', 6: '#898989' };
let mapSig = '', mapPick = null;
function renderMap(items) {
  const box = $('seatMap'), info = $('mapInfo');
  if (!items.length) { box.classList.add('hidden'); info.classList.add('hidden'); mapSig = ''; mapPick = null; return; }
  box.classList.remove('hidden');
  const list = items.map((it, i) => ({ ...it, n: i + 1, block: String(it.key || '').split('|')[0] }));
  const sig = JSON.stringify(list.map(i => [i.key, i.n])) + lang;
  if (sig !== mapSig) {
    mapSig = sig;
    const by = {}; list.forEach(i => { (by[i.block] = by[i.block] || []).push(i); });
    let g = '<rect class="pitchbg" x="398" y="256" width="426" height="294" rx="22"/><g class="lines"><line x1="610" y1="266" x2="610" y2="540"/><circle cx="610" cy="402" r="51"/>'
      + '<path d="M413 321H483V488H413M413 365H437V443H413M483 368A44 44 0 0 1 483 437"/><path d="M809 321H741V488H809M809 365H785V443H809M741 368A44 44 0 0 0 741 437"/></g>';
    for (const [num, cat, , , , , pts] of STADIUM)
      g += `<polygon class="blk" data-b="${num}" points="${pts}" fill="${CAT[cat]}" opacity="${by[num] ? 1 : 0.22}"/>`;
    for (const [num, , part, x, y, size] of STADIUM)
      if (!part && size) g += `<text class="num${by[num] ? ' on' : ''}" x="${x}" y="${y}" font-size="${size}" text-anchor="middle" dominant-baseline="central" pointer-events="none">${num}</text>`;
    for (const [num, its] of Object.entries(by)) {
      const shapes = STADIUM.filter(b => b[0] === num);
      if (!shapes.length) continue;
      shapes.forEach(b => { g += `<polygon points="${b[6]}" fill="none" stroke="#111" stroke-width="3.5" stroke-linejoin="round" pointer-events="none"/>`; });
      const pts = (shapes.find(b => !b[2]) || shapes[0])[6].split(' ').map(p => p.split(',').map(Number));
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      const mx = (Math.min(...xs) + Math.max(...xs)) / 2, my = Math.min(...ys) - 4, label = its.map(i => i.n).join(','), w = Math.max(30, 12 + label.length * 11);
      g += `<g pointer-events="none"><rect x="${(mx - w / 2).toFixed(0)}" y="${(my - 15).toFixed(0)}" width="${w}" height="30" rx="15" fill="#111" stroke="#fff" stroke-width="2.5"/>`
        + `<text x="${mx.toFixed(0)}" y="${my.toFixed(0)}" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">${label}</text></g>`;
    }
    box.innerHTML = `<svg viewBox="180 20 860 780" xmlns="http://www.w3.org/2000/svg" role="img">${g}</svg>`;
    box.querySelectorAll('polygon[data-b]').forEach(p => { p.onclick = () => { mapPick = p.dataset.b; showPick(by); }; });
    box._by = by;
    if (mapPick && !by[mapPick]) mapPick = null;
  }
  showPick(box._by);
}
function showPick(by) {
  const info = $('mapInfo');
  const mapped = new Set(STADIUM.map(b => b[0]));
  const off = Object.keys(by).filter(b => !mapped.has(b)).flatMap(b => by[b].map(i => i.seatInfo));
  let html = '';
  if (mapPick && by[mapPick]) html = by[mapPick].map(i => `<div><b>${i.n}</b> · ${esc(i.seatInfo)} <span class="p">· ${esc(i.price)}</span></div>`).join('');
  else html = `<span class="p">${esc(T.mapTap)}</span>`;
  if (off.length) html += `<div class="p">${esc(fmt(T.mapOff, { t: off.join(', ') }))}</div>`;
  info.innerHTML = html; info.classList.remove('hidden');
}

// ================= skipped tickets =================
let skipOpen = false;
function renderSkip(list) {
  const n = list.length;
  if (!n) skipOpen = false;
  $('skipRow').classList.toggle('hidden', !n);
  $('skipText').textContent = fmt(T.skipping, { n });
  $('skipToggle').textContent = skipOpen ? T.skipHide : T.skipShow;
  $('skipList').classList.toggle('hidden', !skipOpen);
  if (!skipOpen) return;
  const why = s => s.r === 'removed' ? T.rsRemoved : s.r === 'error' ? T.rsError : fmt(T.rsFailed, { n: s.n || '' });
  const when = ts => new Date(ts - offset).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
  $('skipList').innerHTML = list.map(s => `<div class="item"><span>${esc(s.l)} <span class="why">· ${esc(why(s))} · ${esc(fmt(T.rsUntil, { t: when(s.until) }))}</span></span>
      <button class="small" data-allow="${esc(s.key)}" type="button">${T.allowOne}</button></div>`).join('')
    + `<div class="btns"><button id="allowAll" type="button">${T.allowAll}</button></div>`;
  $('skipList').querySelectorAll('[data-allow]').forEach(b => { b.onclick = () => send('skipAllow', { key: b.dataset.allow }); });
  $('allowAll').onclick = () => { skipOpen = false; send('skipClear'); };
}

  if (!window.crypto || !crypto.subtle) { $('upText').textContent = 'This browser can\'t encrypt. Open the page in Safari.'; render(); return; }
  if (!await setup()) { render(); startTimers(); return; }
  try { const saved = JSON.parse(localStorage.getItem('rp_state') || 'null'); if (saved) { st = saved; received = 0; } } catch (e) { /* none */ }
  render();
  listen();
  fetchState();
  hello();
  startTimers();
}
let timersOn = false;
function startTimers() {
  if (timersOn) return;
  timersOn = true;
  setInterval(hello, 15000);
  setInterval(() => { if (Date.now() - lastEvent > 45000) { fetchState(); listen(); } }, 20000);   // reconnect if the live link went quiet
  setInterval(() => { tick(); render(); }, 1000);
}
main();
})();
</script>
